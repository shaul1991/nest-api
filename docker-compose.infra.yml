# Infrastructure services (shared between Blue/Green slots)
# Run with: docker compose -p nest-api-infra-{env} -f docker-compose.infra.yml --env-file .env.{env} up -d

services:
  postgres:
    image: postgres:18-alpine
    container_name: nest-api-postgres-${ENV:-prod}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres_data_${ENV:-prod}:/var/lib/postgresql/data
    networks:
      - nest-api-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: nest-api-redis-${ENV:-prod}
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data_${ENV:-prod}:/data
    networks:
      - nest-api-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data_prod:
  postgres_data_dev:
  redis_data_prod:
  redis_data_dev:

networks:
  nest-api-network:
    name: nest-api-${ENV:-prod}-network
    driver: bridge
