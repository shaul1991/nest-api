# Infrastructure services (shared between Blue/Green slots)
# Run with: docker compose -p nest-api-infra-{env} -f docker-compose.infra.yml --env-file .env.{env} up -d

services:
  postgres:
    image: postgres:18-alpine
    container_name: nest-api-postgres-${ENV:-prod}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres_data_${ENV:-prod}:/var/lib/postgresql/data
    networks:
      - nest-api-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: nest-api-redis-${ENV:-prod}
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data_${ENV:-prod}:/data
    networks:
      - nest-api-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: nest-api-minio-${ENV:-prod}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data_${ENV:-prod}:/data
    networks:
      - nest-api-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    container_name: nest-api-minio-init-${ENV:-prod}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb --ignore-existing myminio/$${MINIO_BUCKET:-uploads};
      mc anonymous set download myminio/$${MINIO_BUCKET:-uploads}/public;
      echo 'Bucket initialization complete';
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-uploads}
    networks:
      - nest-api-network
    restart: "no"

volumes:
  postgres_data_prod:
  postgres_data_dev:
  redis_data_prod:
  redis_data_dev:
  minio_data_prod:
  minio_data_dev:

networks:
  nest-api-network:
    name: nest-api-${ENV:-prod}-network
    driver: bridge
