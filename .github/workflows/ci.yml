name: CI Pipeline

on:
  push:
    branches: [release, develop]
  pull_request:
    branches: [release, develop]

env:
  NODE_VERSION: '22'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: nest_api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d nest_api_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test
        env:
          NODE_ENV: test
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: nest_api_test
          DATABASE_USER: test
          DATABASE_PASSWORD: test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: ''

      - name: Run e2e tests
        run: npm run test:e2e
        env:
          NODE_ENV: test
          # AppModule용 환경변수 (DATABASE_* 형식)
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: nest_api_test
          DATABASE_USER: test
          DATABASE_PASSWORD: test
          # auth.e2e-spec.ts용 환경변수 (DB_* 형식)
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: nest_api_test
          DB_USER: test
          DB_PASSWORD: test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: ''
          # JWT 시크릿 (최소 32자 이상 필요)
          JWT_SECRET: test-jwt-secret-key-for-ci-minimum-32-chars
          JWT_REFRESH_SECRET: test-jwt-refresh-secret-key-for-ci-32-chars

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # Development: 자동 배포
  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    steps:
      - name: Trigger Jenkins Dev Deployment
        run: |
          echo "Triggering Jenkins job nest-api-dev"
          curl -X POST \
            -H "Authorization: token ${{ secrets.JENKINS_API_TOKEN }}" \
            "${{ secrets.JENKINS_URL }}/job/홈%20서버/job/nest-api-dev/build" \
            --fail --silent --show-error || echo "Jenkins notification sent"

      - name: Notify via n8n
        if: success()
        run: |
          curl -X POST https://n8n.shaul.link/webhook/ci-result \
            -H "Content-Type: application/json" \
            -d '{
              "status": "success",
              "branch": "develop",
              "commit": "${{ github.sha }}",
              "commit_message": "${{ github.event.head_commit.message }}",
              "author": "${{ github.actor }}",
              "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }' || echo "n8n notification sent"

  # Production: n8n을 통한 Slack 알림 및 thread_ts 저장
  notify-prod-ready:
    name: Notify Production Ready
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    steps:
      - name: Notify via n8n
        run: |
          curl -X POST https://n8n.shaul.link/webhook/ci-result \
            -H "Content-Type: application/json" \
            -d '{
              "status": "success",
              "branch": "release",
              "commit": "${{ github.sha }}",
              "commit_message": "${{ github.event.head_commit.message }}",
              "author": "${{ github.actor }}",
              "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }'
          echo "n8n notification sent - thread_ts will be saved by n8n"
