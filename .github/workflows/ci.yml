name: CI Pipeline

on:
  push:
    branches: [release, develop]
  pull_request:
    branches: [release, develop]

env:
  NODE_VERSION: '22'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: nest_api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d nest_api_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test
        env:
          NODE_ENV: test
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: nest_api_test
          DATABASE_USER: test
          DATABASE_PASSWORD: test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: ''

      - name: Run e2e tests
        run: npm run test:e2e
        env:
          NODE_ENV: test
          # AppModule용 환경변수 (DATABASE_* 형식)
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: nest_api_test
          DATABASE_USER: test
          DATABASE_PASSWORD: test
          # auth.e2e-spec.ts용 환경변수 (DB_* 형식)
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: nest_api_test
          DB_USER: test
          DB_PASSWORD: test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: ''
          # JWT 시크릿 (최소 32자 이상 필요)
          JWT_SECRET: test-jwt-secret-key-for-ci-minimum-32-chars
          JWT_REFRESH_SECRET: test-jwt-refresh-secret-key-for-ci-32-chars

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # Development: 자동 배포
  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    steps:
      - name: Trigger Jenkins Dev Deployment
        run: |
          echo "Triggering Jenkins job nest-api-dev"
          curl -X POST \
            -H "Authorization: token ${{ secrets.JENKINS_API_TOKEN }}" \
            "${{ secrets.JENKINS_URL }}/job/홈%20서버/job/nest-api-dev/build" \
            --fail --silent --show-error || echo "Jenkins notification sent"

      - name: Notify Slack - Dev Deployed
        if: success()
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
            -H "Content-Type: application/json" \
            -d '{
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "🚀 Dev 배포 시작",
                    "emoji": true
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Branch:*\ndevelop"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Commit:*\n`${{ github.sha }}`"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Commit Message:*\n${{ github.event.head_commit.message }}"
                  }
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "👤 *Author:* ${{ github.actor }} | 🔗 <https://dev-api-nest.shaul.link|Dev Server>"
                    }
                  ]
                }
              ]
            }'

  # Production: Slack 승인 요청
  notify-prod-ready:
    name: Notify Production Ready
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    steps:
      - name: Send Slack Approval Request
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
            -H "Content-Type: application/json" \
            -d '{
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "✅ Production 배포 준비 완료",
                    "emoji": true
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Branch:*\nrelease"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Commit:*\n`${{ github.sha }}`"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Commit Message:*\n${{ github.event.head_commit.message }}"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*CI Status:*\n✅ Lint 통과\n✅ Test 통과\n✅ Build 성공"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Author:*\n${{ github.actor }}"
                    }
                  ]
                },
                {
                  "type": "divider"
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "🚀 Jenkins 배포",
                        "emoji": true
                      },
                      "style": "primary",
                      "url": "https://jenkins.shaul.link/job/%ED%99%88%20%EC%84%9C%EB%B2%84/job/nest-api-prod/",
                      "action_id": "jenkins_deploy"
                    },
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "📋 변경사항",
                        "emoji": true
                      },
                      "url": "https://github.com/${{ github.repository }}/commit/${{ github.sha }}",
                      "action_id": "view_changes"
                    },
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "🔧 GitHub Actions",
                        "emoji": true
                      },
                      "url": "https://github.com/${{ github.repository }}/actions/workflows/deploy-prod.yml",
                      "action_id": "github_actions"
                    }
                  ]
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "⚠️ Production 배포는 신중하게 진행해주세요. | 🔗 <https://api-nest.shaul.link|Production Server>"
                    }
                  ]
                }
              ]
            }'
