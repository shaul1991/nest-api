# =============================================================================
# Staging 환경 Docker Compose 설정
# =============================================================================
# Blue-Green 배포를 지원하는 스테이징 환경 구성
# 포트 스키마: Blue=3200, Green=3201
#
# 실행 방법:
#   Blue 슬롯:  docker compose -p nest-api-staging -f docker/staging/docker-compose.staging.yml --profile blue up -d
#   Green 슬롯: docker compose -p nest-api-staging -f docker/staging/docker-compose.staging.yml --profile green up -d
#   인프라 전체: docker compose -p nest-api-staging -f docker/staging/docker-compose.staging.yml --profile infra up -d
# =============================================================================

name: nest-api-staging

services:
  # ===========================================================================
  # 인프라 서비스
  # ===========================================================================

  postgres-staging:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-nest_api_staging}
      POSTGRES_USER: ${DATABASE_USER:-nestjs}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres-staging-data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-nestjs} -d ${DATABASE_NAME:-nest_api_staging}"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - infra

  redis-staging:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-6381}:6379"
    volumes:
      - redis-staging-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - infra

  # ===========================================================================
  # 애플리케이션 서비스 - Blue 슬롯
  # ===========================================================================

  app-blue:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: ${DOCKER_IMAGE:-nest-api}:${IMAGE_TAG:-staging}
    restart: unless-stopped
    ports:
      - "${BLUE_PORT:-3200}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=staging
      - PORT=3000
      - DATABASE_HOST=${DATABASE_HOST:-postgres-staging}
      - DATABASE_PORT=5432
      - DATABASE_NAME=${DATABASE_NAME:-nest_api_staging}
      - DATABASE_USER=${DATABASE_USER:-nestjs}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - REDIS_HOST=${REDIS_HOST:-redis-staging}
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_ACCESS_TOKEN_EXPIRES_IN=${JWT_ACCESS_TOKEN_EXPIRES_IN:-15m}
      - JWT_REFRESH_TOKEN_EXPIRES_IN=${JWT_REFRESH_TOKEN_EXPIRES_IN:-7d}
      - BCRYPT_SALT_ROUNDS=${BCRYPT_SALT_ROUNDS:-12}
      - AUTH_RATE_LIMIT_TTL=${AUTH_RATE_LIMIT_TTL:-60}
      - AUTH_RATE_LIMIT_MAX=${AUTH_RATE_LIMIT_MAX:-10}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      # MinIO 설정 (선택적)
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio-staging}
      - MINIO_PORT=${MINIO_PORT:-9000}
      - MINIO_USE_SSL=${MINIO_USE_SSL:-false}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET:-uploads-staging}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres-staging:
        condition: service_healthy
      redis-staging:
        condition: service_healthy
    networks:
      - staging-network
    profiles:
      - blue
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.staging-blue.rule=Host(`staging-api-nest.shaul.link`)"
      - "traefik.http.services.staging-blue.loadbalancer.server.port=3000"

  # ===========================================================================
  # 애플리케이션 서비스 - Green 슬롯
  # ===========================================================================

  app-green:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: ${DOCKER_IMAGE:-nest-api}:${IMAGE_TAG:-staging}
    restart: unless-stopped
    ports:
      - "${GREEN_PORT:-3201}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=staging
      - PORT=3000
      - DATABASE_HOST=${DATABASE_HOST:-postgres-staging}
      - DATABASE_PORT=5432
      - DATABASE_NAME=${DATABASE_NAME:-nest_api_staging}
      - DATABASE_USER=${DATABASE_USER:-nestjs}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - REDIS_HOST=${REDIS_HOST:-redis-staging}
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_ACCESS_TOKEN_EXPIRES_IN=${JWT_ACCESS_TOKEN_EXPIRES_IN:-15m}
      - JWT_REFRESH_TOKEN_EXPIRES_IN=${JWT_REFRESH_TOKEN_EXPIRES_IN:-7d}
      - BCRYPT_SALT_ROUNDS=${BCRYPT_SALT_ROUNDS:-12}
      - AUTH_RATE_LIMIT_TTL=${AUTH_RATE_LIMIT_TTL:-60}
      - AUTH_RATE_LIMIT_MAX=${AUTH_RATE_LIMIT_MAX:-10}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      # MinIO 설정 (선택적)
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio-staging}
      - MINIO_PORT=${MINIO_PORT:-9000}
      - MINIO_USE_SSL=${MINIO_USE_SSL:-false}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET:-uploads-staging}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres-staging:
        condition: service_healthy
      redis-staging:
        condition: service_healthy
    networks:
      - staging-network
    profiles:
      - green
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.staging-green.rule=Host(`staging-api-nest.shaul.link`)"
      - "traefik.http.services.staging-green.loadbalancer.server.port=3000"

  # ===========================================================================
  # 선택적 서비스
  # ===========================================================================

  # MinIO 오브젝트 스토리지 (선택적)
  minio-staging:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9002}:9000"
      - "${MINIO_CONSOLE_PORT:-9003}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio-staging-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - staging-network
    profiles:
      - storage

  # Nginx 로드밸런서 (선택적 - Caddy 대신 사용 시)
  nginx-staging:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app-blue
    networks:
      - staging-network
    profiles:
      - loadbalancer

# ===========================================================================
# 볼륨 정의
# ===========================================================================
volumes:
  postgres-staging-data:
    driver: local
  redis-staging-data:
    driver: local
  minio-staging-data:
    driver: local

# ===========================================================================
# 네트워크 정의
# ===========================================================================
networks:
  staging-network:
    driver: bridge
