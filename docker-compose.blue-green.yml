# Blue-Green Application Services
# Connects to shared infrastructure (postgres, redis) via external network
# Run with: docker compose -p nest-api-{env}-{slot} -f docker-compose.blue-green.yml --profile {blue|green} up -d

services:
  app-blue:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOCKER_IMAGE:-nest-api}:${IMAGE_TAG:-latest}
    container_name: nest-api-blue-${ENV:-prod}
    restart: unless-stopped
    ports:
      - "${BLUE_PORT:-3100}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3000
      - DATABASE_HOST=nest-api-postgres-${ENV:-prod}
      - DATABASE_PORT=5432
      - DATABASE_NAME=${DATABASE_NAME}
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - REDIS_HOST=nest-api-redis-${ENV:-prod}
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_ACCESS_TOKEN_EXPIRES_IN=${JWT_ACCESS_TOKEN_EXPIRES_IN:-15m}
      - JWT_REFRESH_TOKEN_EXPIRES_IN=${JWT_REFRESH_TOKEN_EXPIRES_IN:-7d}
      - BCRYPT_SALT_ROUNDS=${BCRYPT_SALT_ROUNDS:-12}
      - AUTH_RATE_LIMIT_TTL=${AUTH_RATE_LIMIT_TTL:-60}
      - AUTH_RATE_LIMIT_MAX=${AUTH_RATE_LIMIT_MAX:-10}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - nest-api-network
    profiles:
      - blue

  app-green:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOCKER_IMAGE:-nest-api}:${IMAGE_TAG:-latest}
    container_name: nest-api-green-${ENV:-prod}
    restart: unless-stopped
    ports:
      - "${GREEN_PORT:-3102}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3000
      - DATABASE_HOST=nest-api-postgres-${ENV:-prod}
      - DATABASE_PORT=5432
      - DATABASE_NAME=${DATABASE_NAME}
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - REDIS_HOST=nest-api-redis-${ENV:-prod}
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_ACCESS_TOKEN_EXPIRES_IN=${JWT_ACCESS_TOKEN_EXPIRES_IN:-15m}
      - JWT_REFRESH_TOKEN_EXPIRES_IN=${JWT_REFRESH_TOKEN_EXPIRES_IN:-7d}
      - BCRYPT_SALT_ROUNDS=${BCRYPT_SALT_ROUNDS:-12}
      - AUTH_RATE_LIMIT_TTL=${AUTH_RATE_LIMIT_TTL:-60}
      - AUTH_RATE_LIMIT_MAX=${AUTH_RATE_LIMIT_MAX:-10}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - nest-api-network
    profiles:
      - green

networks:
  nest-api-network:
    name: nest-api-${ENV:-prod}-network
    external: true
